<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claim Your Offer — Ridgewood Moving Company</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #EEF4F8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 40px 36px 32px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 4px 24px rgba(28,58,74,0.10);
    }

    .label {
      font-family: 'Courier New', monospace;
      font-size: 13px;
      color: #6B9FBF;
      margin-bottom: 12px;
      letter-spacing: 0.02em;
    }

    h1 {
      font-family: 'Oswald', sans-serif;
      font-size: 32px;
      color: #1C3A4A;
      line-height: 1.1;
      margin-bottom: 28px;
    }

    .field-label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #1C3A4A;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .field {
      margin-bottom: 16px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .row .field {
      margin-bottom: 0;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #D0DDE6;
      border-radius: 6px;
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 14px;
      color: #1C3A4A;
      background: #fff;
      transition: border-color 0.15s;
      outline: none;
    }

    input::placeholder { color: #AAB8C2; }
    input:focus { border-color: #6B9FBF; }

    button[type="submit"] {
      width: 100%;
      padding: 15px;
      background: #C0392B;
      color: #fff;
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 16px;
      font-weight: 700;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.15s;
      letter-spacing: 0.01em;
    }

    button[type="submit"]:hover { background: #A93226; }

    .subtext {
      text-align: center;
      font-size: 12px;
      color: #8A9BAA;
      margin-top: 12px;
    }

    .success-msg {
      text-align: center;
      padding: 24px 0 8px;
      font-size: 18px;
      font-weight: 600;
      color: #1C3A4A;
      line-height: 1.5;
    }

    .success-msg span {
      display: block;
      font-size: 14px;
      font-weight: 400;
      color: #6B9FBF;
      margin-top: 8px;
    }

    .logos {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid #EEF4F8;
    }

    .logos img.ridgewood { height: 52px; width: auto; }
    .logos img.ha { height: 28px; width: auto; opacity: 0.75; }

    .logo-divider {
      width: 1px;
      height: 36px;
      background: #D0DDE6;
    }

    .offer-badge {
      background: #EEF4F8;
      border-radius: 6px;
      padding: 10px 14px;
      margin-bottom: 20px;
      font-size: 13px;
      color: #1C3A4A;
      font-weight: 600;
      text-align: center;
      letter-spacing: 0.01em;
    }

    .offer-badge span {
      color: #C0392B;
    }

    .powered {
      margin-top: 20px;
      font-size: 12px;
      color: #AAB8C2;
      text-align: center;
    }

    .powered a {
      color: #6B9FBF;
      text-decoration: none;
    }
</style>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-KELC0QSGEG"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-KELC0QSGEG');
</script>
</head>
<body>

  <div class="card">
    <div class="logos">
      <img class="ridgewood" src="ridgewood-logo.png" alt="Ridgewood Moving Services">
      <div class="logo-divider"></div>
      <img class="ha" src="ha-logo.svg" alt="HouseAccount">
    </div>

    <div class="offer-badge">Buy 1 TV mount installation, <span>get 1 free</span></div>

    <h1>Tell us where to find you.</h1>

    <form id="claim-form" name="ridgewood-leads" method="POST" data-netlify="true">
      <input type="hidden" name="form-name" value="ridgewood-leads">

      <div class="field">
        <label class="field-label" for="address">Home Address</label>
        <input type="text" id="address" name="address" placeholder="123 Maple Street, Bergen, NJ…" required>
      </div>

      <div class="row">
        <div class="field">
          <label class="field-label" for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="First &amp; last" required>
        </div>
        <div class="field">
          <label class="field-label" for="phone">Phone</label>
          <input type="tel" id="phone" name="phone" placeholder="(___) ___-____" required>
        </div>
      </div>

      <div class="field">
        <label class="field-label" for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@home.com" required>
      </div>

      <button type="submit">Claim my free offer &rarr;</button>
      <p class="subtext">We'll text within 1 business day. No spam, promise.</p>
    </form>
  </div>

  <p class="powered">Powered by <a href="https://www.houseaccount.com" target="_blank">HouseAccount</a></p>

  <script>
    document.getElementById('claim-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const form = e.target;
      const data = new FormData(form);

      try {
        const res = await fetch('/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams(data).toString()
        });

        if (res.ok) {
          form.innerHTML = '<div class="success-msg">You\'re all set! 🎉<span>We\'ll be in touch within 1 business day.</span></div>';
        } else {
          alert('Something went wrong. Please try again.');
        }
      } catch (err) {
        alert('Something went wrong. Please try again.');
      }
    });
  </script>

</body>
</html>
